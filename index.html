<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marc W – Cloud Solutions Development</title>
  <meta name="description" content="Marc W – Cloud Solutions Development">
  <style>
    :root {
      --bg: #fafafa;
      --fg: #1c1c1e;
      --muted: #6b6b70;
      --accent: #0a66c2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121214;
        --fg: #ededee;
        --muted: #9a9aa0;
        --accent: #70b5f9;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }
    main { max-width: 34rem; }
    h1 { margin: 0; font-size: 2.25rem; letter-spacing: -0.02em; }
    .role { margin: 0.25rem 0 1.5rem; color: var(--muted); font-size: 1.1rem; }
    p { margin: 0 0 1.5rem; }
    a { color: var(--accent); text-decoration: none; font-weight: 500; }
    a:hover, a:focus { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>Marc W</h1>
    <p class="role">Cloud Solutions Development</p>
    <p>Ich entwerfe und entwickle skalierbare, zuverlässige Cloud-Lösungen – von der Architektur bis zum automatisierten Betrieb.</p>
    <!-- TODO: Platzhalter durch die echte LinkedIn-Profil-URL ersetzen -->
    <a href="https://www.linkedin.com/in/PLATZHALTER" rel="noopener">LinkedIn</a>
  </main>
</body>
</html>
